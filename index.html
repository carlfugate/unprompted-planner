<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[un]prompted planner</title>
<meta name="description" content="Unofficial schedule browser and planner for [un]prompted, October 27-29, 2026.">
<meta name="theme-color" content="#0b1424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand"><span class="br">[</span>un<span class="br">]</span>prompted <span class="sub">planner</span></h1>
    <div class="tools">
      <button id="searchBtn" class="icon-btn" aria-label="Search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button id="starOnly" class="icon-btn" aria-label="Show starred only" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </div>
  </div>
  <div id="searchRow" class="search-row" hidden>
    <input id="q" type="search" placeholder="Search titles, speakers, companies, abstracts" autocomplete="off">
  </div>
  <nav class="days" id="days" aria-label="Day"></nav>
  <nav class="tracks" id="tracks" aria-label="Track"></nav>
</header>

<main id="main" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<nav class="tabbar" aria-label="View">
  <button data-view="agenda" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    <span>Agenda</span></button>
  <button data-view="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
    <span>My plan</span><b id="planCount" class="count" hidden></b></button>
  <button data-view="now">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Now</span></button>
</nav>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <button class="close icon-btn" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheetBody"></div>
  </div>
</dialog>

<script src="app.js" defer></script>
</body>
</html>
